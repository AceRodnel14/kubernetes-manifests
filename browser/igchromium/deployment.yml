# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igchromium
  namespace: default
spec:
  replicas: 0  # KEDA HTTPScaledObject owns the replica count
  selector:
    matchLabels:
      app: igchromium
  template:
    metadata:
      labels:
        app: igchromium
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: igchromium
          image: linuxserver/chromium:version-3d7cd855
          ports:
            - containerPort: 3000
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: TZ
              value: Asia/Manila
            - name: CHROME_CLI
              value: >-
                http://pc.xyz.abc/
                http://termpyfilebrowser-service.default.svc.cluster.local:8080/
                http://termpyfilebrowser-service.default.svc.cluster.local:7681/
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config-volume
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: igchromium-config-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termpyfilebrowser
  namespace: default
spec:
  replicas: 0  # KEDA ScaledObject follows igchromium's pod count
  selector:
    matchLabels:
      app: termpyfilebrowser
  template:
    metadata:
      labels:
        app: termpyfilebrowser
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: termpyfilebrowser
          image: eacer/custom-termpyfilebrowser:main-260802223655
          ports:
            - name: ttyd-port
              containerPort: 7681
            - name: fileb-port
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Manila
            - name: WORKDIR_PATH
              value: /config
          readinessProbe:
            tcpSocket:
              port: fileb-port
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: igchromium-config-pvc