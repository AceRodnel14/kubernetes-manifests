apiVersion: apps/v1
kind: Deployment
metadata:
  name: passman
  namespace: default
  labels:
    app: passman
spec:
  replicas: 0  # KEDA's HTTPScaledObject drives this from here — start at zero
  selector:
    matchLabels:
      app: passman
  template:
    metadata:
      labels:
        app: passman
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: passman
          image: eacer/passman:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
          - secretRef:
              name: passman-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "100Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
