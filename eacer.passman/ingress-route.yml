apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: passman
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`passman.k8s.xyz.abc`)
      kind: Rule
      services:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
  tls:
    secretName: k8s-homelab-tls
