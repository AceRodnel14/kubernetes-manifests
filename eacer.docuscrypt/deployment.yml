apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuscrypt
  namespace: default
  labels:
    app: docuscrypt
spec:
  replicas: 0  # KEDA's HTTPScaledObject drives this from here — start at zero
  selector:
    matchLabels:
      app: docuscrypt
  template:
    metadata:
      labels:
        app: docuscrypt
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: docuscrypt
          image: eacer/docuscrypt:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "200Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15